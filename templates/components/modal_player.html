<!-- ============================================== -->
<!-- MODAL: THÊM / SỬA TUYỂN THỦ -->
<!-- ============================================== -->
<div id="player-modal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs hidden flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200 rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-5 custom-scrollbar max-h-[90vh] overflow-y-auto">
        <!-- Modal Header -->
        <div class="flex items-center justify-between border-b border-slate-100 pb-4">
            <h3 id="modal-player-title" class="text-lg font-black font-heading text-slate-900 flex items-center gap-2">
                <i class="fa-solid fa-user-pen text-indigo-600"></i>
                <span>Chỉnh Sửa Tuyển Thủ</span>
            </h3>
            <button onclick="closePlayerModal()" class="text-slate-400 hover:text-slate-600 p-2 rounded-xl hover:bg-slate-100 transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Modal Form Content -->
        <form id="player-form" onsubmit="handleSavePlayer(event)" class="space-y-4 text-xs">
            <input type="hidden" id="form-mode" value="edit">

            <!-- Basic Info: ID & Nickname -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <div>
                    <label class="block font-bold text-slate-700 mb-1 font-heading">ID Định Danh (Username)</label>
                    <input type="text" id="form-id" required placeholder="vd: wanlee" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 focus:bg-white transition">
                    <span class="text-[10px] text-slate-400">Không dấu, viết liền.</span>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1 font-heading">Tên Hiển Thị (Nickname)</label>
                    <input type="text" id="form-nickname" required placeholder="vd: Wanlee Gánh Team" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 focus:bg-white transition">
                </div>
            </div>

            <!-- Avatar URL & Quick Selector -->
            <div>
                <label class="block font-bold text-slate-700 mb-1 font-heading">Ảnh Đại Diện (Avatar URL)</label>
                <div class="flex items-center gap-3">
                    <img id="form-avatar-preview" src="https://api.dicebear.com/7.x/bottts/svg?seed=preview" class="w-11 h-11 rounded-2xl bg-slate-100 border border-slate-200 object-cover shadow-xs" alt="Preview">
                    <input type="text" id="form-avatar" oninput="updateAvatarPreview(this.value)" placeholder="Dán link ảnh hoặc để mặc định bottts..." class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 focus:bg-white transition">
                    <button type="button" onclick="randomizeAvatar()" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 rounded-xl transition text-xs font-bold" title="Tạo avatar ngẫu nhiên">
                        <i class="fa-solid fa-dice text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- THỰC LỰC & PHÂN BẬC (TỰ ĐỘNG TÍNH TOÁN KHÁCH QUAN) -->
            <div class="p-4 rounded-2xl bg-gradient-to-br from-indigo-50/70 to-purple-50/50 border border-indigo-100 space-y-2.5">
                <div class="flex items-center justify-between">
                    <span class="font-bold text-indigo-900 text-xs flex items-center gap-1.5 font-heading">
                        <i class="fa-solid fa-shield-halved text-indigo-600"></i>
                        <span>Thực Lực & Phân Bậc (Tự Động)</span>
                    </span>
                    <span id="form-display-badge" class="px-2.5 py-1 rounded-xl bg-white text-indigo-700 font-bold text-[11px] border border-indigo-200 shadow-2xs">
                        🌱 Tân Binh
                    </span>
                </div>
                <div class="grid grid-cols-2 gap-2 text-center pt-1">
                    <div class="p-2.5 rounded-xl bg-white/80 border border-indigo-100">
                        <span class="text-[10px] text-slate-500 font-bold uppercase tracking-wider block">Điểm Thực Lực</span>
                        <b id="form-display-power" class="text-base font-black font-heading text-indigo-600">50.0</b>
                    </div>
                    <div class="p-2.5 rounded-xl bg-white/80 border border-indigo-100">
                        <span class="text-[10px] text-slate-500 font-bold uppercase tracking-wider block">Trận Đấu (W/L)</span>
                        <b id="form-display-record" class="text-base font-black font-heading text-slate-800">0 (0/0)</b>
                    </div>
                </div>
                <p class="text-[11px] text-slate-500 leading-relaxed pt-1">
                    <i class="fa-solid fa-circle-check text-emerald-500 mr-1"></i>
                    Hệ thống tính toán 100% khách quan từ dữ liệu kết quả thắng/thua bằng mô hình Ridge Regression (RAPM). Không sử dụng điểm kỹ năng hay vị trí cảm tính.
                </p>
            </div>

            <!-- Modal Actions -->
            <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
                <button type="button" onclick="closePlayerModal()" class="px-4 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold transition">
                    Hủy
                </button>
                <button type="submit" id="btn-save-player" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold font-heading shadow transition">
                    Lưu Thông Tin
                </button>
            </div>
        </form>
    </div>
</div>

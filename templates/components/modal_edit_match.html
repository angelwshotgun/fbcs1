<!-- ============================================== -->
<!-- MODAL: CHỈNH SỬA TRẬN ĐẤU (EDIT MATCH MODAL) -->
<!-- ============================================== -->
<div id="edit-match-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs hidden flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
    <div class="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-2xl w-full p-5 sm:p-7 space-y-5 my-8">
        <!-- Modal Header -->
        <div class="flex items-center justify-between border-b border-slate-100 pb-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-lg font-bold shadow-xs">
                    <i class="fa-solid fa-pen-to-square"></i>
                </div>
                <div>
                    <h3 class="text-lg font-black font-heading text-slate-900 flex items-center gap-2">
                        <span>Sửa Trận Đấu #<span id="edit-match-id-badge">0</span></span>
                        <span id="edit-match-code-badge" class="text-xs px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200 font-mono font-normal">M-000</span>
                    </h3>
                    <p class="text-xs text-slate-500">Chỉnh sửa đội hình 2 bên và kết quả thắng/thua. Hệ thống sẽ tự động tính lại toàn bộ Elo.</p>
                </div>
            </div>
            <button type="button" onclick="closeEditMatchModal()" class="text-slate-400 hover:text-slate-600 p-2 rounded-xl hover:bg-slate-100 transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Form -->
        <form id="edit-match-form" onsubmit="event.preventDefault(); handleSaveEditMatch();" class="space-y-4">
            <input type="hidden" id="edit-match-id" value="">

            <!-- 2 Teams Selection -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Team 1 (Blue) -->
                <div class="p-4 rounded-2xl bg-blue-50/50 border border-blue-200 space-y-2.5">
                    <div class="flex items-center justify-between pb-1.5 border-b border-blue-200/60">
                        <span class="font-extrabold font-heading text-blue-900 text-xs flex items-center gap-1.5">
                            <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span> Đội 1 (Xanh) - 5 Tuyển Thủ
                        </span>
                    </div>
                    <div class="space-y-2">
                        <select id="edit-t1-slot-0" class="w-full bg-white border border-blue-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 font-bold focus:outline-none focus:border-indigo-500"></select>
                        <select id="edit-t1-slot-1" class="w-full bg-white border border-blue-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 font-bold focus:outline-none focus:border-indigo-500"></select>
                        <select id="edit-t1-slot-2" class="w-full bg-white border border-blue-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 font-bold focus:outline-none focus:border-indigo-500"></select>
                        <select id="edit-t1-slot-3" class="w-full bg-white border border-blue-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 font-bold focus:outline-none focus:border-indigo-500"></select>
                        <select id="edit-t1-slot-4" class="w-full bg-white border border-blue-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 font-bold focus:outline-none focus:border-indigo-500"></select>
                    </div>
                </div>

                <!-- Team 2 (Red) -->
                <div class="p-4 rounded-2xl bg-rose-50/50 border border-rose-200 space-y-2.5">
                    <div class="flex items-center justify-between pb-1.5 border-b border-rose-200/60">
                        <span class="font-extrabold font-heading text-rose-900 text-xs flex items-center gap-1.5">
                            <span class="w-2.5 h-2.5 rounded-full bg-rose-600"></span> Đội 2 (Đỏ) - 5 Tuyển Thủ
                        </span>
                    </div>
                    <div class="space-y-2">
                        <select id="edit-t2-slot-0" class="w-full bg-white border border-rose-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 font-bold focus:outline-none focus:border-indigo-500"></select>
                        <select id="edit-t2-slot-1" class="w-full bg-white border border-rose-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 font-bold focus:outline-none focus:border-indigo-500"></select>
                        <select id="edit-t2-slot-2" class="w-full bg-white border border-rose-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 font-bold focus:outline-none focus:border-indigo-500"></select>
                        <select id="edit-t2-slot-3" class="w-full bg-white border border-rose-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 font-bold focus:outline-none focus:border-indigo-500"></select>
                        <select id="edit-t2-slot-4" class="w-full bg-white border border-rose-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 font-bold focus:outline-none focus:border-indigo-500"></select>
                    </div>
                </div>
            </div>

            <!-- Winner Selection -->
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-slate-700">Đội Giành Chiến Thắng:</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="p-3 rounded-2xl border border-blue-200 bg-blue-50/50 flex items-center gap-2.5 cursor-pointer hover:bg-blue-100/50 transition">
                        <input type="radio" name="edit_match_winner_radio" id="edit-winner-t1" value="team1" class="text-blue-600 focus:ring-blue-500">
                        <div>
                            <span class="font-bold text-xs text-blue-900 block font-heading">Đội 1 (Xanh) Thắng</span>
                            <span class="text-[10px] text-blue-700">Cộng Elo cho Đội 1</span>
                        </div>
                    </label>
                    <label class="p-3 rounded-2xl border border-rose-200 bg-rose-50/50 flex items-center gap-2.5 cursor-pointer hover:bg-rose-100/50 transition">
                        <input type="radio" name="edit_match_winner_radio" id="edit-winner-t2" value="team2" class="text-rose-600 focus:ring-rose-500">
                        <div>
                            <span class="font-bold text-xs text-rose-900 block font-heading">Đội 2 (Đỏ) Thắng</span>
                            <span class="text-[10px] text-rose-700">Cộng Elo cho Đội 2</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Kill Score Inputs -->
            <div class="p-3.5 rounded-2xl bg-gradient-to-r from-blue-50/60 to-rose-50/60 border border-slate-200 space-y-2">
                <label class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-skull-crossbones text-orange-500"></i>
                    <span>Tỉ Số Mạng Hạ Gục (Kill Score):</span>
                </label>
                <div class="flex items-center justify-center gap-3">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-blue-700">Đội Xanh:</span>
                        <input type="number" id="edit-team1-kills" min="0" max="99" placeholder="0" class="w-16 text-center text-base font-black font-heading border-2 border-blue-200 rounded-xl py-1 bg-white text-blue-700 focus:outline-none focus:border-blue-500">
                    </div>
                    <span class="text-slate-400 font-bold">—</span>
                    <div class="flex items-center gap-2">
                        <input type="number" id="edit-team2-kills" min="0" max="99" placeholder="0" class="w-16 text-center text-base font-black font-heading border-2 border-rose-200 rounded-xl py-1 bg-white text-rose-700 focus:outline-none focus:border-rose-500">
                        <span class="text-xs font-bold text-rose-700">:Đội Đỏ</span>
                    </div>
                </div>
            </div>

            <!-- Notes / AI info -->
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-slate-700">Ghi Chú / Thông Tin Trận Đấu:</label>
                <input type="text" id="edit-match-notes" placeholder="VD: AI Scoreboard: MVP ..., SVP ..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs text-slate-800 focus:outline-none focus:border-indigo-500">
            </div>

            <!-- Actions -->
            <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-slate-100">
                <button type="button" onclick="closeEditMatchModal()" class="px-4 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold transition">
                    Hủy
                </button>
                <button type="submit" id="btn-save-edit-match" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold font-heading text-xs shadow-md shadow-indigo-500/20 transition flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Lưu Thay Đổi & Tính Lại Elo</span>
                </button>
            </div>
        </form>
    </div>
</div>

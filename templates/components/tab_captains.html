<!-- ============================================== -->
<!-- TAB 2: CHIA ĐỘI VỚI ĐỘI TRƯỞNG (CAPTAINS) -->
<!-- ============================================== -->
<section id="tab-content-captains" class="tab-pane hidden space-y-6">
    <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-xs flex flex-col md:flex-row items-center justify-between gap-5">
        <div>
            <h2 class="text-2xl font-black font-heading text-slate-900 flex items-center gap-3">
                <span>👑 Chia Đội Với 2 Đội Trưởng</span>
                <span id="captain-badge" class="text-xs px-3 py-1 rounded-full bg-amber-50 text-amber-800 border border-amber-200 font-bold">
                    Cần: 2 Captains + 8 Tuyển Thủ
                </span>
            </h2>
            <p class="text-sm text-slate-500 mt-1">
                Chọn 2 tuyển thủ làm Đội trưởng (đánh dấu vương miện), sau đó chọn thêm 8 tuyển thủ còn lại để xếp đội.
            </p>
        </div>
        <div class="flex flex-wrap items-center gap-2.5 w-full md:w-auto">
            <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 shadow-2xs">
                <span class="text-xs text-slate-500 font-semibold hidden sm:inline"><i class="fa-solid fa-sliders text-amber-500 mr-1"></i>Chế độ:</span>
                <select id="captain-matchmaking-mode" class="bg-transparent text-xs text-slate-800 font-bold focus:outline-none cursor-pointer">
                    <option value="composite">⚡ Toàn Diện (Elo + Stats)</option>
                    <option value="pure_elo">🎯 Thuần Elo Ẩn (Không dùng Stat)</option>
                </select>
            </div>
            <button onclick="clearCaptainSelection()" class="px-3.5 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold transition">
                <i class="fa-solid fa-rotate-left mr-1 text-slate-400"></i> Đặt lại
            </button>
            <button onclick="handleCreateTeamsWithCaptains()" class="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold font-heading text-xs shadow transition">
                <i class="fa-solid fa-crown mr-1"></i> Xếp Đội Cân Bằng
            </button>
        </div>
    </div>

    <!-- Captains Status Overview -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="p-5 rounded-2xl border border-amber-200 bg-amber-50/50 flex items-center gap-4 shadow-xs">
            <div class="w-12 h-12 rounded-2xl bg-amber-500 text-white flex items-center justify-center text-xl font-bold font-heading shadow-xs">
                1
            </div>
            <div>
                <span class="text-xs uppercase tracking-wider text-amber-700 font-bold">Đội Trưởng 1</span>
                <h4 id="cap1-display-name" class="font-black font-heading text-slate-900 text-base">Chưa chọn</h4>
            </div>
        </div>
        <div class="p-5 rounded-2xl border border-amber-200 bg-amber-50/50 flex items-center gap-4 shadow-xs">
            <div class="w-12 h-12 rounded-2xl bg-amber-500 text-white flex items-center justify-center text-xl font-bold font-heading shadow-xs">
                2
            </div>
            <div>
                <span class="text-xs uppercase tracking-wider text-amber-700 font-bold">Đội Trưởng 2</span>
                <h4 id="cap2-display-name" class="font-black font-heading text-slate-900 text-base">Chưa chọn</h4>
            </div>
        </div>
    </div>

    <!-- Captains Player Selection Grid -->
    <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-xs">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-sm font-bold font-heading text-slate-900">Chọn 2 Đội Trưởng & 8 Tuyển Thủ</h3>
            <span id="captain-selection-text" class="text-xs text-amber-700 font-bold">Đã chọn: 0/10</span>
        </div>
        <div id="captains-players-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3.5 custom-scrollbar max-h-[500px] overflow-y-auto p-1">
            <!-- Rendered via JS -->
        </div>
    </div>
</section>

<!-- Top Navigation Header -->
<header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-50 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <!-- Logo & Brand -->
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('matchmaker')">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-blue-500 flex items-center justify-center text-white font-extrabold text-xl shadow-md shadow-indigo-500/20">
                    <i class="fa-solid fa-gamepad"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <span class="text-xl font-black font-heading tracking-tight text-slate-900">FBCS AI</span>
                        <span class="bg-indigo-50 text-indigo-700 text-xs px-2.5 py-0.5 rounded-full font-bold border border-indigo-200/70">v3.0 Pro</span>
                    </div>
                    <p class="text-xs text-slate-500 font-medium hidden sm:block">Hệ Thống Chia Đội & Chỉ Số Tuyển Thủ</p>
                </div>
            </div>

            <!-- Navigation Tabs -->
            <nav class="flex space-x-1 sm:space-x-1.5 overflow-x-auto py-2">
                <button onclick="switchTab('matchmaker')" id="tab-btn-matchmaker" class="nav-tab px-3.5 py-2 rounded-xl text-sm font-bold font-heading transition-all flex items-center space-x-2 bg-indigo-600 text-white shadow-sm">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Chia Đội</span>
                </button>
                <button onclick="switchTab('captains')" id="tab-btn-captains" class="nav-tab px-3.5 py-2 rounded-xl text-sm font-bold font-heading transition-all flex items-center space-x-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100">
                    <i class="fa-solid fa-crown text-amber-500"></i>
                    <span>Đội Trưởng</span>
                </button>
                <button onclick="switchTab('simulation')" id="tab-btn-simulation" class="nav-tab px-3.5 py-2 rounded-xl text-sm font-bold font-heading transition-all flex items-center space-x-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100">
                    <i class="fa-solid fa-gamepad text-purple-600"></i>
                    <span>Mô Phỏng 5vs5</span>
                </button>
                <button onclick="switchTab('players')" id="tab-btn-players" class="nav-tab px-3.5 py-2 rounded-xl text-sm font-bold font-heading transition-all flex items-center space-x-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100">
                    <i class="fa-solid fa-users-gear text-indigo-500"></i>
                    <span>Quản Trị</span>
                </button>
                <button onclick="switchTab('leaderboard')" id="tab-btn-leaderboard" class="nav-tab px-3.5 py-2 rounded-xl text-sm font-bold font-heading transition-all flex items-center space-x-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100">
                    <i class="fa-solid fa-trophy text-amber-500"></i>
                    <span>BXH Elo</span>
                </button>
                <button onclick="switchTab('synergies')" id="tab-btn-synergies" class="nav-tab px-3.5 py-2 rounded-xl text-sm font-bold font-heading transition-all flex items-center space-x-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100">
                    <i class="fa-solid fa-handshake text-emerald-500"></i>
                    <span>Cặp Ăn Ý</span>
                </button>
                <button onclick="switchTab('settings')" id="tab-btn-settings" class="nav-tab px-3.5 py-2 rounded-xl text-sm font-bold font-heading transition-all flex items-center space-x-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100">
                    <i class="fa-solid fa-gear text-slate-400"></i>
                    <span class="hidden md:inline">Cài Đặt</span>
                </button>
            </nav>
        </div>
    </div>
</header>
